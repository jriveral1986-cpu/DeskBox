name: CI

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: Optional test filter; leave empty for the full regression suite
        required: false
        default: ''
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    env:
      RestoreLockedMode: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit message attribution check
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $messages = git log --format=%B "${{ github.event.pull_request.base.sha }}..HEAD"
          if ($messages -match '(?im)^\s*(co-authored-by|generated[ -]with|generated-by)\s*[: ]') {
            Write-Host 'Forbidden attribution trailer (Co-Authored-By / Generated with) found in commit messages.'
            exit 1
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\DeskBox.sln --locked-mode -p:Platform=x64 -p:RuntimeIdentifier=win-x64

      - name: Setup pinned Rust toolchain
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Build
        run: dotnet build .\src\DeskBox\DeskBox.csproj --configuration Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -v:minimal

      - name: Test
        timeout-minutes: 10
        shell: pwsh
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          $testArgs = @('test', '.\tests\DeskBox.Tests\DeskBox.Tests.csproj', '--configuration', 'Release', '--no-restore', '-p:Platform=x64', '-p:RuntimeIdentifier=win-x64', '-p:WindowsAppSdkBootstrapInitialize=false', '--blame-hang', '--blame-hang-timeout', '5m', '--logger', 'trx;LogFileName=test-results.trx', '-v:minimal')
          if (-not [string]::IsNullOrWhiteSpace($env:TEST_FILTER)) {
            $testArgs += @('--filter', $env:TEST_FILTER)
          }
          & dotnet @testArgs
          exit $LASTEXITCODE

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/DeskBox.Tests/TestResults/**/*.trx

      - name: Upload compiled application
        uses: actions/upload-artifact@v4
        with:
          name: DeskBox-Release-win-x64
          path: src/DeskBox/bin/x64/Release/net10.0-windows10.0.22621.0/win-x64/
          if-no-files-found: error
          retention-days: 7
